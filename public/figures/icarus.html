<style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;

  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

.iso.pbd{
  --anatomy-page:#000;--anatomy-card:#040506;--anatomy-text:#b9bec5;--anatomy-strong:#e7eaef;--anatomy-muted:#7d838b;
  --anatomy-paper:#040506;--anatomy-face:#15191c;--anatomy-top:#171b1e;
  --anatomy-shade-0:#0a0d0f;--anatomy-shade-1:#0d1012;--anatomy-shade-2:#101316;--anatomy-shade-3:#13171a;
  --anatomy-lit-top:color-mix(in srgb,var(--kind) 22%,#171b1e);--anatomy-lit-shade:color-mix(in srgb,var(--kind) 13%,#101316);
  --anatomy-hi:#ccd2d6;--anatomy-mid:#646a6f;--anatomy-lo:#393e42;--anatomy-faint:#22272a;--anatomy-lit:var(--kind);
  --anatomy-halo:#000;--anatomy-halo-opacity:.95;--anatomy-dot:#e7eaef;
  --anatomy-mono:"IBM Plex Mono",ui-monospace,monospace;
}
.iso.pbd .iso-face-text{font-family:var(--anatomy-mono)}
.iso.pbd .iso-plate{
  background:
    radial-gradient(1px 1px at 8% 14%,#ffffff55,transparent 60%),
    radial-gradient(1px 1px at 22% 78%,#ffffff33,transparent 60%),
    radial-gradient(1px 1px at 37% 9%,#ffffff40,transparent 60%),
    radial-gradient(1px 1px at 63% 21%,#ffffff2e,transparent 60%),
    radial-gradient(1.3px 1.3px at 86% 12%,color-mix(in srgb,var(--kind) 60%,#fff),transparent 60%),
    radial-gradient(1px 1px at 93% 64%,#ffffff38,transparent 60%),
    radial-gradient(1px 1px at 71% 88%,#ffffff2a,transparent 60%),
    radial-gradient(1px 1px at 4% 52%,#ffffff30,transparent 60%),
    radial-gradient(1px 1px at 49% 94%,#ffffff24,transparent 60%),
    var(--anatomy-card);
  box-shadow:none;border:1px solid rgb(255 255 255 / .1);
}
.iso.pbd .iso-plate-corner{font-family:var(--anatomy-mono);font-size:12px;letter-spacing:.1em}
.iso.pbd .iso-plate-corner[data-corner="fig"]{color:var(--kind)}
.iso.pbd .iso-plate-corner[data-corner="readout"]{letter-spacing:.03em;color:#e7eaef;font-size:12.5px}
.iso.pbd{--ok:#7fd1a1;--bad:#e8838a}
/* A selected part takes the lit fills and the piece's colour; the rest step back. */
.iso.pbd [data-sel]{transition:opacity .45s cubic-bezier(.32,.72,0,1)}
.iso.pbd [data-focus] [data-sel]:not([data-on]){opacity:.42}
.iso.pbd [data-on] .iso-top{fill:var(--anatomy-lit-top)}
.iso.pbd [data-on] .iso-shade{fill:var(--anatomy-lit-shade)}
.iso.pbd [data-on] .iso-edge{stroke:var(--kind)}
.iso.pbd [data-on] .iso-line[data-wire]{stroke:var(--kind)}
.iso.pbd [data-verdict="ok"] .iso-top{fill:color-mix(in srgb,var(--ok) 16%,var(--anatomy-top))}
.iso.pbd [data-verdict="ok"] .iso-edge{stroke:var(--ok)}
.iso.pbd [data-verdict="bad"] .iso-top{fill:color-mix(in srgb,var(--bad) 16%,var(--anatomy-top))}
.iso.pbd [data-verdict="bad"] .iso-edge{stroke:var(--bad)}
.iso.pbd .iso-line[data-tone="ok"]{stroke:var(--ok)}
.iso.pbd .iso-line[data-tone="bad"]{stroke:var(--bad)}
.iso.pbd .screen{fill:#e7eaef;letter-spacing:0}
.iso.pbd .screen.dim{fill:var(--kind)}
.iso.pbd .screen.ok{fill:var(--ok)}
.iso.pbd .screen.bad{fill:var(--bad)}
.iso.pbd .vlamp .iso-top,.iso.pbd .vlamp .iso-shade{transition:fill .35s}
.iso.pbd .vlamp[data-verdict="ok"] .iso-top{fill:var(--ok)}
.iso.pbd .vlamp[data-verdict="ok"] .iso-shade{fill:color-mix(in srgb,var(--ok) 55%,#0d1012)}
.iso.pbd .vlamp[data-verdict="bad"] .iso-top{fill:var(--bad)}
.iso.pbd .vlamp[data-verdict="bad"] .iso-shade{fill:color-mix(in srgb,var(--bad) 55%,#0d1012)}
.iso.pbd .intake{transition:opacity .4s}
.iso.pbd .mark{transition:opacity .35s}
.iso.pbd .iso-swatch[data-mark="green"] path{stroke:var(--ok)}
.iso.pbd .iso-swatch[data-mark="red"] path{stroke:var(--bad)}
.iso.pbd .score{fill:#e7eaef;letter-spacing:.08em;transition:fill .3s}
.iso.pbd .score[data-on]{fill:var(--kind)}
.iso.pbd .team{fill:var(--anatomy-hi);letter-spacing:0}
.iso.pbd .ask{fill:var(--kind)}
.iso.pbd .q{fill:var(--anatomy-mid)}
.iso.pbd .sw .on,.iso.pbd .sw[data-on] .off{display:none}
.iso.pbd .sw[data-on] .on{display:inline}
.iso.pbd .sw[data-on] .led{opacity:.95}
.iso.pbd .win{fill:#07090a;stroke:none;transition:fill .6s}
.iso.pbd .win[data-on]{fill:#ffd08a}
.iso.pbd .lampHead{opacity:.35;transition:opacity .6s}
.iso.pbd .lampHead[data-on]{opacity:1}
.iso.pbd [data-line][data-on] .iso-line{stroke:var(--kind)}
.iso.pbd [data-line][data-on] .iso-wire-end{stroke:var(--kind)}
.iso.pbd .glow{fill:var(--kind);opacity:0;transition:opacity .5s}
.iso.pbd .glow[data-on]{opacity:.9}
.iso.pbd .iso-legend{font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;font-weight:300}
.iso.pbd .iso-stage{outline:none;touch-action:pan-y}
.iso.pbd .iso-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.iso.pbd .iso-swatch[data-mark="lit"] path{stroke:var(--kind)}
.iso.pbd .digits{fill:var(--kind);letter-spacing:.12em}
.iso.pbd .prop{fill:var(--anatomy-face);fill-opacity:.22;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);vector-effect:non-scaling-stroke}

html,body{margin:0;background:transparent;color-scheme:dark;overflow:hidden}
/* The site says how to use it under the frame, so the readout has the row. */
.iso.pbd .iso-plate-corner[data-corner="hint"]{display:none}
body{padding:6px;font:300 15px/1.6 "IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;color:#b9bec5;-webkit-font-smoothing:antialiased}
.iso-figure{margin:0}
.frame{--tick:8px;position:relative}
.frame::before{content:"";position:absolute;inset:-1px;pointer-events:none;z-index:2;--c:linear-gradient(var(--kind),var(--kind));
background:var(--c) top left/var(--tick) 1px,var(--c) top left/1px var(--tick),var(--c) top right/var(--tick) 1px,var(--c) top right/1px var(--tick),var(--c) bottom left/var(--tick) 1px,var(--c) bottom left/1px var(--tick),var(--c) bottom right/var(--tick) 1px,var(--c) bottom right/1px var(--tick);
background-repeat:no-repeat;transition:inset 260ms cubic-bezier(.2,.8,.2,1)}
.frame:hover::before{inset:-5px}
/* Bare (?bare): just the machine, for recording the bar's preview loops. */
html.bare body{padding:0}
html.bare .iso-legend,html.bare .iso-plate-corners,html.bare .frame::before{display:none}
html.bare .iso-plate{border:0;padding:12px 8px}
</style></head>

`;

const P = {"origin":[300,292.96800125887944],"scale":2.728447542928736,"azimuth":40,"elevation":30};
const ARMS = [0,1.5707963267948966,3.141592653589793,4.71238898038469], SPIN = [1,-1,1,-1], ARM_TO = 62, PROP_R = 20;
const Z = {"battery":[26,35],"bottom":[35,37],"arm":[37,40],"top":[40,42],"esc":[40,42.6],"standoff":[42,47],"pcb":[47,48.6],"teensy":[48.6,50],"mount":[40,41.6],"bell":[41.6,51],"cap":[51,52.6],"shaft":[52.6,55],"prop":54.4};
const STOPS = [{"sel":"mcu","wires":"signal","text":"flight controller · Teensy 4.0 on my board"},{"sel":"esc","wires":"phase","text":"4 ESCs · throttle in, 3-phase power out"},{"sel":"motor","wires":"","text":"4 motors · pairs turn opposite ways"}];
const bladesAt = (i, phase) => {
  const a = ARMS[i];
  const [mx, my] = [Math.cos(a) * ARM_TO, Math.sin(a) * ARM_TO];
  const tip = (t) => iso([mx + Math.cos(phase + t) * (PROP_R - 0.8), my + Math.sin(phase + t) * (PROP_R - 0.8), Z.prop], P);
  return pathOf([tip(0), iso([mx, my, Z.prop], P), tip(Math.PI)]);
};

const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const drone = svg.querySelector('[data-part="drone"]');
const shadow = svg.querySelector('[data-part="shadow"]');
const blades = [0, 1, 2, 3].map((i) => svg.querySelector('[data-blade="' + i + '"]'));
const readout = document.querySelector("[data-readout]");
const still = matchMedia("(prefers-reduced-motion: reduce)");

let pick = -1, touring = !still.matches, visible = false, frame = 0, last = 0, clock = 0, idle = 0;
const phase = [0, 0.7, 1.4, 2.1];
let spin = 1, spinTo = 1;

function select(n) {
  if (n === pick) return;
  pick = n;
  const stop = STOPS[n];
  svg.toggleAttribute("data-focus", Boolean(stop));
  svg.querySelectorAll("[data-sel]").forEach((el) => {
    const on = stop && (el.dataset.sel === stop.sel || el.dataset.sel === stop.wires);
    el.toggleAttribute("data-on", Boolean(on));
    el.querySelectorAll("[data-wire]").forEach((w) => w.toggleAttribute("data-flow", Boolean(on) && !still.matches));
  });
  spinTo = stop && stop.sel === "motor" ? 1.8 : 1;
  readout.textContent = stop ? stop.text : "Icarus · hovering on its own controller";
  stage.setAttribute("aria-valuetext", readout.textContent);
}

/* The tour: three seconds on each part, then a breath with nothing picked. */
const tourAt = (t) => { const p = t % 11; return p < 3 ? 0 : p < 6 ? 1 : p < 9 ? 2 : -1; };

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  clock += dt;
  if (touring) select(tourAt(clock));
  spin += (spinTo - spin) * (1 - Math.exp(-dt / 0.6));
  blades.forEach((el, i) => { phase[i] += SPIN[i] * 26 * spin * dt; el.setAttribute("d", bladesAt(i, phase[i])); });
  const bob = Math.sin(clock * 1.4) * 1.3;
  drone.setAttribute("transform", translateAlong(P, [0, 0, bob]));
  shadow.style.opacity = (0.75 - bob * 0.06).toFixed(3);
  frame = visible ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible && !still.matches) { last = 0; frame = requestAnimationFrame(tick); } };
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);

const hold = () => { touring = false; clearTimeout(idle); idle = setTimeout(() => { touring = !still.matches; clock = 0; }, 3600); };
stage.addEventListener("pointerover", (event) => {
  const el = event.target.closest("[data-sel]");
  if (!el) return;
  const n = STOPS.findIndex((s) => s.sel === el.dataset.sel || s.wires === el.dataset.sel);
  if (n < 0) return;
  hold();
  select(n);
});
stage.addEventListener("keydown", (event) => {
  let n = null;
  if (event.key === "ArrowRight" || event.key === "ArrowDown") n = (pick + 1) % STOPS.length;
  if (event.key === "ArrowLeft" || event.key === "ArrowUp") n = (pick + STOPS.length - 1) % STOPS.length;
  if (event.key === "Escape") n = -1;
  if (n === null) return;
  event.preventDefault();
  hold();
  select(n);
});
blades.forEach((el, i) => el.setAttribute("d", bladesAt(i, phase[i])));
select(still.matches ? 0 : -1);
