<script>if(location.search.includes("bare"))document.documentElement.classList.add("bare");(() => {
  const STEP = 1000 / 30;
  let next = 0, quietUntil = 0;
  try {
    if (parent !== window)
      parent.addEventListener("scroll", () => { quietUntil = performance.now() + 180; }, { passive: true });
  } catch (e) {}
  window.paced = (cb) => requestAnimationFrame(function go(t) {
    if (t < quietUntil || t < next) { requestAnimationFrame(go); return; }
    next = Math.max(next + STEP, t - STEP / 2);
    cb(t);
  });
})();</script>

`;

const BUILDINGS = [{"name":"home","at":8},{"name":"school","at":20},{"name":"hall","at":32}];
const CYCLE = 13.5, START = 0.6, STEP = 0.22;
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const switches = [...svg.querySelectorAll("[data-sw]")];
const wins = [...svg.querySelectorAll("[data-win]")];
const lines = [...svg.querySelectorAll("[data-line]")];
const lamps = [...svg.querySelectorAll("[data-lamp]")];
const readout = document.querySelector("[data-readout]");
const still = matchMedia("(prefers-reduced-motion: reduce)");

let T = 0, target = 0, frame = 0, last = 0, touring = !still.matches, visible = false, idle = 0, shown = -1;
function draw() {
  const t = ((T % CYCLE) + CYCLE) % CYCLE;
  const joined = t > 12 ? Math.max(0, 32 - Math.floor((t - 12) / 0.04)) : Math.max(0, Math.min(32, Math.floor((t - START) / STEP) + 1));
  if (joined === shown) return;
  shown = joined;
  switches.forEach((el, i) => el.toggleAttribute("data-on", i < joined));
  BUILDINGS.forEach((b, i) => {
    const on = joined >= b.at;
    wins[i].querySelectorAll(".win").forEach((w) => w.toggleAttribute("data-on", on));
    lines[i].toggleAttribute("data-on", on);
  });
  lamps.forEach((el) => el.toggleAttribute("data-on", joined >= 32));
  const lit = BUILDINGS.filter((b) => joined >= b.at).length;
  readout.textContent = joined >= 32 ? "32 members · the whole street lit" : "members " + joined + " of 32 · " + (lit ? BUILDINGS.filter((b) => joined >= b.at).map((b) => b.name).join(", ") + " lit" : "gathering");
}
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  if (touring) target += dt;
  T = still.matches ? target : T + (target - T) * (1 - Math.exp(-dt / 0.15));
  draw();
  const settled = !touring && Math.abs(target - T) < 0.002;
  if (settled) T = target;
  frame = visible && !settled ? paced(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = paced(tick); } };
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
const steer = (to) => {
  touring = false;
  target = Math.max(0, to);
  clearTimeout(idle);
  idle = setTimeout(() => { touring = !still.matches; run(); }, 3600);
  run();
};
stage.addEventListener("pointermove", (event) => {
  const box = svg.getBoundingClientRect();
  const share = Math.max(0, Math.min(1, ((event.clientX - box.left) / box.width - 0.1) / 0.8));
  steer(Math.floor(target / CYCLE) * CYCLE + START + share * (32 * STEP + 0.4));
});
stage.addEventListener("keydown", (event) => {
  let to = null;
  if (event.key === "ArrowRight") to = target + STEP;
  if (event.key === "ArrowLeft") to = target - STEP;
  if (to === null) return;
  event.preventDefault();
  steer(to);
});
if (still.matches) { touring = false; T = target = 10; }
draw();
</script></body></html>
